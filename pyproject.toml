[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdndds"
version = "0.2.1"
description = "Pythonic wrapper around eProsima FastDDS Python bindings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "wdndds contributors" }]
dependencies = [
    "wechatbot-sdk>=0.3.0,<1.0",
]
keywords = ["fastdds", "dds", "iot", "ros2", "wdndds"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: Linux :: aarch64",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# wheel 现在带着 built eProsima FastDDS Python bindings (aarch64 / Debian 12
# / Python 3.11 / libfastdds 3.6.x)。换平台要 rebuild —— 用 ``/tmp/fastdds_ws``
# 那个 colcon 流程 (参见 README + .venv/src/wdndds/src/wdndds/dds/_fastdds.py)。

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools]
packages = [
    "wdndds",
    "wdndds.dds",
    "wdndds.dds._native",
    "wdndds.dds._native.fastdds",
]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"wdndds" = [
    "py.typed",
    "dds/_native/lib/*.so*",
]
"wdndds.dds._native" = [
    "_wdndds_string.so",
]
"wdndds.dds._native.fastdds" = [
    "_fastdds_python.so",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]