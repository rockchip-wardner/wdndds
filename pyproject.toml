[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdndds"
version = "0.6.0"
description = "RPC-DDS cshim + Python wrappers for per-model compute isolation on Rockchip RK3588."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "wdndds contributors" }]
dependencies = [
]
keywords = ["fastdds", "dds", "iot", "ros2", "wdndds", "rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: Linux :: AArch64",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# wdndds 0.3 ships a **cshim** (libwdndds_cshim.so) compiled at pip-install
# time via the custom build_py hook in ``_build_wdndds.py``. The hook
# compiles the C++ source under ``src/wdndds/cshim_src/`` against the
# system libfastrtps-dev / libfastcdr-dev (Debian: apt install both),
# and emits ``src/wdndds/dds/_native/libwdndds_cshim.so`` which the
# wheel packages via setuptools package_data.
#
# FastDDS' native rrpc (Request-Reply) requires >= 2.10; we target the
# system 2.9 with standard RELIABLE Pub-Sub + reply topics. The Python
# API surface stays RPC-style (client.call(payload) -> reply).
#
# The previous ``WdnddsStringTopicDataType`` SWIG helper + bundled
# python-fastdds is removed in 0.3 — cshim handles everything.

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools]
packages = [
    "wdndds",
    "wdndds.dds",
    "wdndds.dds._native",
]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"wdndds" = [
    "py.typed",
]
"wdndds.dds._native" = [
    # Both _build.py build_py hook outputs. _build.py source-compiles
    # them from idl/ + cshim_src/ into src/wdndds/dds/_native/ at
    # pip install time; both MUST be listed here so MANIFEST.in +
    # wheel packaging include them. (Without libwdndds_idl.so in
    # this list, the wheel installs the cshim but loses the idl
    # library it links against — every import then fails with
    # "cannot open shared object file: libwdndds_idl.so".)
    "libwdndds_cshim.so",
    "libwdndds_idl.so",
    # Bundled .so files from previous wdndds 0.2.x are NOT shipped
    # anymore — the cshim links dynamically against the system
    # libfastrtps / libfastcdr (apt install libfastrtps-dev libfastcdr-dev
    # at build time, runtime uses whatever the system loader finds).
]

[tool.setuptools.cmdclass]
build_py = "wdndds._build.build_py"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]