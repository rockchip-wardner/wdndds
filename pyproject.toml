[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdndds"
version = "0.2.1"
description = "Pythonic wrapper around eProsima FastDDS Python bindings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "wdndds contributors" }]
dependencies = [
    "wechatbot-sdk>=0.3.0,<1.0",
]
keywords = ["fastdds", "dds", "iot", "ros2", "wdndds"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: Linux :: aarch64",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# wheel 现在带着 built eProsima FastDDS Python bindings + 自写的
# WdnddsStringTopicDataType helper (aarch64 / Debian 12 / Python 3.11 /
# libfastdds 2.6.12)。换平台要 rebuild —— 跑 ``build_native.sh`` (README
# + ``.venv/src/wdndds/src/wdndds/dds/_fastdds.py`` 里有详细流程)。
#
# 支持两种 layout (setuptools 自动按文件存在与否 pick):
#   * 1.x flat:     ``_native/fastdds.py`` + ``_native/_fastdds_python.so``
#                   (Fast-DDS-Python 1.1.x, FastDDS 2.6.x 配套)
#   * 2.x/3.x pkg:  ``_native/fastdds/__init__.py`` + ``_native/fastdds/_fastdds_python.so``
#                   (Fast-DDS-Python 2.x/3.x, FastDDS 2.x/3.x 配套)

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools]
packages = [
    "wdndds",
    "wdndds.dds",
    "wdndds.dds._native",
]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"wdndds" = [
    "py.typed",
    "dds/_native/lib/*.so*",
    "dds/_native/fastdds.py",       # 1.x flat layout
    "dds/_native/_fastdds_python.so",  # 1.x flat layout
]
"wdndds.dds._native" = [
    "_wdndds_string.so",
    "wdndds_string.py",
]
# 2.x/3.x pkg layout（可选）：用 glob 列举，有就装、没有就当没这个包
# setuptools 不支持自动检测空 package，但我们的 _native/fastdds/__init__.py
# 可以保留空 stub，方便 _bundled_available() 在两种 layout 之间正确判断。

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]